name: Deploy

# Merging to main deploys. It follows CI rather than `push`, so a commit pushed
# straight to main is deployed only once its own CI run has passed.
# `workflow_dispatch` stays as the manual fallback (docs/deployment.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

# Least privilege (#290): checkout is the only step that uses GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  deploy:
    # `branches: [main]` above also matches a pull request from a fork whose
    # branch is called main, and this repository is public. So the CI run must
    # come from a push, which a fork cannot make to our main.
    # On workflow_run, `github.sha` is the tip of main: the last line skips a
    # re-run of an old CI run instead of deploying it, and makes the default
    # checkout below the commit CI passed. All four are asserted in config.test.ts.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Cloudflare Vite plugin writes the deploy configuration into
      # dist/captain_prospectus/wrangler.json; `wrangler deploy` picks it up.
      - run: pnpm run build
      # Migrations run BEFORE the new code. Once the data stage is protected,
      # every migration must work with the deployed Worker (ADR-0033).
      - name: Apply D1 migrations, then deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: |
            d1 migrations apply captain-prospectus --remote
            deploy
      # Nobody watches an automatic deploy: a Worker that deployed but does not
      # answer has to turn this run red. /api/me with no cookie is 401 by design.
      - name: Smoke test
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' https://prospectus.fixbyte.cloud/login)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' https://prospectus.fixbyte.cloud/api/me)" = 401
