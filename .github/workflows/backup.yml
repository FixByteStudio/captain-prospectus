name: Backup

# D1 holds the only copy of the data, and the project's loudest invariant is
# "never lose a visit". Time Travel covers accidents inside its retention
# window, and goes with the database if it is deleted; this covers the rest.
#
# The artifact this used to upload was a full copy of the database on GitHub,
# for 90 days, which contradicted docs/security.md. It goes to R2 now (ADR-0023).
on:
  schedule:
    # Daily. 04:17 UTC is after the 03:40 retention sweep (wrangler.jsonc), so an
    # export never carries what the sweep was about to redact, and outside any
    # canvassing round: an export blocks the database while it runs.
    - cron: "17 4 * * *"
  workflow_dispatch:

# Least privilege (#290): checkout is the only step that uses GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    # Gated like deploy.yml. The token here can read the whole database, so it
    # should not be available at plain repo-secret level to anyone with write
    # access (#34).
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export the production database
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 export captain-prospectus --remote --output=backup.sql
      # An empty or cut-short export would otherwise land in R2 looking like a
      # backup, and be found out on the day it is needed.
      - name: Check the export holds a schema
        run: test -s backup.sql && grep -q "CREATE TABLE" backup.sql
      # Into R2, not a GitHub artifact (ADR-0023, #34). docs/security.md says
      # the data stays in the Cloudflare account, and this is what makes that
      # true: a GitHub artifact is a third-party copy of every visit note and
      # agent position, readable by anyone with repo access.
      #
      # The bucket and its lifecycle rule are one-time account setup; see
      # docs/deployment.md. R2's free tier is 10 GB against a database measured
      # in megabytes, so ADR-0002 still holds.
      - name: Upload to R2
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            r2 object put
            captain-prospectus-backups/d1/${{ github.run_id }}-backup.sql
            --file=backup.sql --remote
