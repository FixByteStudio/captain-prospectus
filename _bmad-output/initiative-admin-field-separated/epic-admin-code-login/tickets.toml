# The stories of epic-admin-code-login (epic id 3), in build order.
# Refer to an entry as 3.<id> from another epic.

[[entry]]
id = 1
type = "story"
title = "ADR: admins sign in with an email and a code"
description = "Writes, through the new-adr skill, an ADR recording R9–R11: the admin form takes an email and a one-time code instead of a passphrase, each form checks the role, an admin gets a code from their own row or another admin, and break-glass stays in the admin form; it amends ADR-0029's decisions 3 and 7, adds codes-only to its alternatives, and updates the ADR index."
verify = "The ADR is proposed in a pull request, ADR-0029 links to it where it is amended, and the owner sets it accepted."
covers = ["R9", "R10", "R11", "R12"]
after = ["2.1"]
hitl = true
risk = "low"
unknown = "Whether a code typed on the admin form with OWNER_EMAIL is tried as break-glass first or as a code first when both could match."

[[entry]]
id = 2
type = "story"
title = "Each sign-in form checks the role"
description = "Replaces the `passphrase` login kind with `{ kind: \"admin\", email, code }` in schemas.ts and auth.ts, where the conditional UPDATE that spends a code accepts only an agent's code on the agent form and only the typed admin's code on the admin form (anything else the same 401, the code left unspent), break-glass tried first on the raw text; LoginScreen's admin form asks for Adresse e-mail and Code, with its copy in copy/field.ts, and api.md, identity-access.md, security.md and design.md › The login page follow."
verify = "auth.test.ts shows an admin's email and code open an admin session on the admin kind while the same code on the code kind gets 401 and still works afterwards, an agent's code or another admin's email on the admin kind gets 401, and OWNER_EMAIL plus BREAK_GLASS still signs in; on `pnpm dev` an admin signs in with email and a fresh code and lands on /admin."
covers = ["R9", "R10", "R11"]
after = [1]
hitl = false
risk = "medium"
unknown = "The exact French of the admin form's lede and refusal (adminLede, adminRefused) once it asks for a code; the builder asks the owner."
references = ["docs/adr/0038-admins-sign-in-with-an-email-and-a-code.md, Decision 2 and 3", "src/worker/routes/auth.ts", "src/client/auth/LoginScreen.tsx"]

[[entry]]
id = 3
type = "story"
title = "Utilisateurs offers codes only"
description = "Removes the passphrase everywhere it is left after 2 — POST /api/admin/me/passphrase, newPassphrase, passphraseResponseSchema, useGeneratePassphrase, PassphraseDialog, Nouvelle phrase de passe in RowMenu, UsersTable, UsersList and the tabbed UsersScreen, the clear-on-deactivate branch, the copy, and one migration dropping users.passphrase_hash; data-model.md, design.md › Utilisateurs, deployment.md and security.md follow. No line is added to CodeDialog (owner, 2026-10-22)."
verify = "`grep -ri passphrase src` finds nothing, drizzle/ has exactly one new migration and it drops passphrase_hash, and UsersScreen.test.tsx shows your own row's menu on the Administrateurs tab holding Générer un code and Désactiver only."
covers = ["R9", "R11"]
after = [2, "2.6"]
hitl = false
risk = "low"
unknown = "Whether drizzle-kit emits a plain DROP COLUMN or rebuilds the users table; migration-guard reviews either."
references = [".claude/skills/d1-migration/SKILL.md", "src/client/admin/users/UsersScreen.tsx"]

