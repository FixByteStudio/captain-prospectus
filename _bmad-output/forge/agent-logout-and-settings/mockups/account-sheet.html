<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{background:#cfd3db;font-family:"Archivo","Archivo Variable",system-ui,sans-serif;display:flex;gap:48px;padding:40px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:14px;align-items:center}
.cap{font:600 15px system-ui;color:#1b2a4a}
.light{--bg:#f6f7f0;--fg:#1b2a4a;--card:#fff;--sec:#e8eaef;--muted:#5a6478;--border:#d7dae2;--primary:#c9a227;--pfg:#1b2a4a;--pedge:#a8801a;--band:#1b2a4a;--bandfg:#eef0f4;--bandmuted:#95a0b8}
.dark{--bg:#101726;--fg:#e7eaf0;--card:#182031;--sec:#222b3d;--muted:#97a2b8;--border:#2b3547;--primary:#d9b43c;--pfg:#141c2e;--pedge:#e6c65c;--band:#0b1120;--bandfg:#e7eaf0;--bandmuted:#7d899f}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);box-shadow:0 0 0 10px #111,0 20px 50px #0005}
.band{background:var(--band);color:var(--bandfg);padding:44px 16px 0}
.row{height:56px;display:flex;align-items:center;gap:12px}
.mark{width:28px;height:28px;border-radius:50%;border:3px solid var(--primary)}
.brand{display:flex;flex-direction:column;line-height:1.25}
.brand b{font-size:16px}.brand span{font-size:12px;color:var(--bandmuted)}
.dot{margin-left:auto;width:10px;height:10px;border-radius:50%;background:#3fb27f}
.av{width:32px;height:32px;border-radius:50%;background:var(--primary);color:var(--pfg);font:700 12px system-ui;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--pedge),0 0 0 3px var(--bandfg)}
main{padding:24px 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:16px;margin-bottom:12px}
.card .t{font-weight:600;margin-bottom:6px}.card .m{font-size:12px;color:var(--muted)}
.overlay{position:absolute;inset:0;background:#00000080}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:16px 16px 0 0;padding:10px 20px 34px;border-top:1px solid var(--border)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 14px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.head h2{font-size:19px;font-weight:600}
.x{width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px;margin-right:-12px}
.who{display:flex;align-items:center;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--border);margin-bottom:18px}
.who .av{box-shadow:inset 0 0 0 1px var(--pedge);width:40px;height:40px;font-size:14px}
.who .e{font-size:16px;font-weight:500}.who .r{font-size:12px;color:var(--muted);margin-top:2px}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:8px}
.radios{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
.opt{min-height:48px;border:1px solid var(--border);border-radius:6px;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:15px}
.opt.on{background:var(--primary);border-color:var(--pedge);color:var(--pfg)}
.ver{font-size:12px;color:var(--muted);text-align:center;letter-spacing:.02em}
.tabs{position:absolute;left:0;right:0;bottom:0;height:64px;background:var(--card);border-top:1px solid var(--border)}
</style></head><body>
<script>
for (const [cls,label,checked] of [["light","Clair — système",0],["dark","Sombre — choisi « Sombre »",2]]) {
 const opts=["Système","Clair","Sombre"].map((o,i)=>`<div class="opt ${i===checked?'on':''}">${o}</div>`).join("");
 document.write(`<div class="col"><div class="cap">${label}</div><div class="phone ${cls}">
 <div class="band"><div class="row"><div class="mark"></div><div class="brand"><b>Captain Prospectus</b><span>Tournée</span></div><div class="dot"></div><div class="av">FR</div></div></div>
 <main><div class="card"><div class="t">Arrêt 4 sur 20</div><div class="m">Chez Mamy · Rue Haute 112</div></div><div class="card"><div class="t">Friterie Tabora</div><div class="m">Arrêt 5 · 230 m</div></div><div class="card"><div class="t">Le Pré Salé</div><div class="m">Arrêt 6 · 410 m</div></div></main>
 <div class="tabs"></div><div class="overlay"></div>
 <div class="sheet"><div class="grab"></div>
  <div class="head"><h2>Mon compte</h2><div class="x">✕</div></div>
  <div class="who"><div class="av">FR</div><div><div class="e">francois@captain-prospectus.be</div><div class="r">Agent</div></div></div>
  <div class="lbl">Apparence</div><div class="radios" role="radiogroup">${opts}</div>
  <div class="ver">Version du 17 oct. 2026 · a605114</div>
 </div></div></div>`);
}
</script></body></html>
