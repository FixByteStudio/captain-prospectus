# The stories of epic-import-a4-a6, in build order.

[[entry]]
id = 1
type = "story"
title = "docs/design.md follows the Import A4–A6 update"
description = "Rewrites docs/design.md › The CSV import to the 2026-10-10 UX update; shipped as 06884ed."
verify = "docs/design.md › The CSV import agrees with EXPERIENCE.md, DESIGN.md and key-a4-a6-import.html."
covers = ["R8"]
after = []
hitl = false
risk = "low"

[[entry]]
id = 2
type = "story"
title = "The import rail is shared by both paths"
description = "ImportStepper becomes the full-width rail (32px circles, « Étape n » / « En cours » overlines, gold line after a done step, only the current label at phone width) on the CSV and map paths, in ImportStepper.tsx, its placement in ImportScreen.tsx and adminCopy.import.steps in src/client/copy/admin.ts; the step lists stay as they are until entry 4 merges Fichier into Colonnes."
verify = "Component tests assert the done, current and future states with the hidden « (terminée) » and aria-current=\"step\"; on a local build the rail shows on both paths in light, dark and at phone width."
covers = ["R1", "R7"]
after = []
hitl = false
risk = "low"

[[entry]]
id = 3
type = "story"
title = "ADR: the server keeps an import log"
description = "An ADR (new-adr skill) decides how the server records an import: what groups the 250-row batches into one import, what a log row stores (source, file name or zone summary, created and updated counts, the rejected count the client sends since rejected rows never reach the server, the admin, timestamps), how a retry or re-sent batch avoids counting twice (invariant 4), when an import reads « Interrompu », retention, the glossary term, and the additive change to POST /api/admin/prospects/batch; the owner accepts it."
verify = "The ADR is merged as Accepted and names the table, the request field and the read route that entries 7 and 8 build."
covers = ["R3"]
after = []
hitl = true
risk = "medium"
unknown = "Whether « Interrompu » can be known server-side without a closing call from the client."

[[entry]]
id = 4
type = "story"
title = "Source offers two source cards"
description = "SourceStep becomes the two source cards; the CSV card's button opens the file picker, parse errors show under the cards, and the file-reading handler moves to Source, where entry 5's « Changer de fichier » reuses it; FileStep goes away, so the CSV path becomes Source · Fichier & colonnes · Aperçu & validation with today's ColumnsStep as step 2 until entry 5 rebuilds it."
verify = "ImportScreen tests: a file picked from the CSV card lands on step 2 of 3, an empty file shows the Alert on Source, « Dessiner une zone » opens Zone; on a local build the cards match the mockup in light and dark and stack below md."
covers = ["R2", "R1", "R7"]
after = [2]
hitl = false
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "Fichier & colonnes shows the file and the mapping table"
description = "The step opens with the file card, whose « Changer de fichier » reuses entry 4's file-reading handler, then the mapping table with Exemple, Statut chips, « Ignoré » rows and the head and foot counters, and a bottom bar component (Retour secondary, « Étape 2 sur 3 », « Voir l'aperçu ») that entries 6 and 10 reuse; it corrects design.md's « outline » Retour to secondary."
verify = "Tests assert each chip rule (Requis, Coordonnées GPS, Clé unique, Détecté, Optionnel, Ignoré) and that « Voir l'aperçu » stays disabled until Nom has a column; on a local build the step matches the mockup in light and dark and shows one block per field at phone width."
covers = ["R4", "R7", "R8"]
after = [4]
hitl = false
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "Aperçu & validation counts and filters the rows"
description = "The preview gets the summary banner with the separator chip, the two count cards with share chips, « Prêt » / « Sans coordonnées » and reason chips in the ledger, and the « Toutes les lignes » / « Voir les {n} erreurs » filter, on entry 5's bottom bar."
verify = "Tests assert the counts and shares, that the filter shows only rejected rows, and that rejected rows come first; on a local build the step matches the mockup in light and dark."
covers = ["R5"]
after = [5]
hitl = false
risk = "medium"

[[entry]]
id = 10
type = "story"
title = "A running import shows a named progress card"
description = "While batches run, a progress card floats bottom right over entry 5's bottom bar with « Import en cours », the tabular count and an ink Progress bar through a new variant on src/client/ui/progress.tsx (other callers, including the field DailyProgress, stay gold), and both import progress bars (PreviewStep and MapStep) get an aria-label from adminCopy.import, closing #231."
verify = "Tests assert Retour and « Importer {n} lignes » are disabled while running and that both progressbars have an accessible name; on a local build the card matches the mockup; the PR quotes the field precache total against 1,000 KiB."
covers = ["R6"]
after = [6]
hitl = false
risk = "medium"

[[entry]]
id = 7
type = "story"
title = "The server logs each import"
description = "Builds what entry 3's ADR decides: the D1 table and migration (d1-migration skill), the additive field on the batch request in src/shared/schemas.ts, the log write on each batch, a GET of the last 5 imports, and docs/api.md, data-model.md, domains/ingestion.md and the glossary; server and shared schema only, since entry 8 sends the field and reads the GET."
verify = "Worker tests: batches with one import id give one log row with summed counts, a re-sent batch is not counted twice, a batch without the field still imports and logs nothing, and the GET returns the last 5 newest first."
covers = ["R3"]
after = [3]
hitl = false
risk = "medium"
unknown = "The table and request shape wait on entry 3's ADR."

[[entry]]
id = 8
type = "story"
title = "Both import paths send the import log"
description = "useImportBatches sends ADR-0030's importLog on every batch (one crypto.randomUUID() importId per run, a retry being a new run, batchIndex, batchCount and rejected), with the CSV file name and rejected-row count from ImportScreen, and from MapStep the polygon's vertex count or the circle's radius and the unnamed-candidate count as rejected; entry 11 adds the imports query and its invalidation in useImportBatches."
verify = "queries tests assert one importId across a run's batches, batchIndex 0..n-1, the batchCount, and a new importId on retry; on a local build, GET /api/admin/imports after a CSV import and an OSM map import returns both with their file name or zone and counts."
covers = ["R3"]
after = [7, 10]
hitl = false
risk = "medium"

[[entry]]
id = 11
type = "story"
title = "Source lists the last five imports"
description = "Source shows Derniers imports under the cards from GET /api/admin/imports (the response type in src/shared/schemas.ts) through a new adminKeys.imports() query that this entry also invalidates in useImportBatches' finally, after entry 8 sends the log: History head icon; Date & heure; Source with a FileSpreadsheet or Map icon (csv « CSV », osm « Carte OpenStreetMap », google « Carte Google », the raw value otherwise); Fichier ou zone (the file name, blank once redacted, or copy.map.vertices / copy.map.circle.radius); Volume right-aligned in .tnum (« +{c} créés · {u} mis à jour · {r} rejetés »); Par (blank once redacted); Statut badge (« Terminé » success tint, « Interrompu » warn tint); the empty state; two-line rows without Par at phone width; and it drops design.md's « Nothing records an import today » line."
verify = "Component tests cover both badges, every source label and the fallback, the zone labels, a redacted row and the empty state; on a local build, after a CSV and a map import the table lists both newest first with « Terminé »; a 300-row import run under a very slow custom DevTools throttling profile, with the tab closed once the card shows 250 / 300, reads « Interrompu » when Source is reloaded after IMPORT_STALE_MS (5 min) (or seed a part-finished import with wrangler d1 execute --local); an empty database shows « Aucun import pour l'instant. »; light, dark and phone width match the mockup."
covers = ["R3", "R7", "R8"]
after = [8]
hitl = false
risk = "medium"

