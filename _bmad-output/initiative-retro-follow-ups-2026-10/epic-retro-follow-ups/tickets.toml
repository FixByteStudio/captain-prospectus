# The stories of epic-retro-follow-ups (epic id 1), in build order.
# Entry ids equal the slice numbers of slices.md (S1-S11). `labels` is this repo's own key: the area and extra labels sent at publish.

[[entry]]
id = 1
type = "story"
title = "Break-glass refuses an agent row"
description = "S1, CAP-7 (579/2, 580/2, F-A, S-7; owner decision): break-glass in src/worker/routes/auth.ts no longer promotes an existing agent row named by OWNER_EMAIL, so \"roles are fixed at creation\" has no exception; it answers the same 401 body as the other login refusals with no Set-Cookie (580/S-3 stays true) and writes nothing, while a deactivated admin owner is still reinstated; code and tests only, the docs line goes to entry 9, and no spend-time lifetime check is added (580 question 5)."
verify = "A Worker test runs break-glass with OWNER_EMAIL naming an active agent and gets the shared 401 body, no Set-Cookie and no new or changed users or sessions row; a second test shows a deactivated admin owner reinstated as before."
covers = ["CAP-7"]
after = []
hitl = false
risk = "medium"
labels = ["area:worker"]
unknown = "Whether break-glass on a deactivated agent row is refused too; the spec says only an existing agent row, so the builder refuses any agent row unless the owner says otherwise."

[[entry]]
id = 2
type = "story"
title = "Tests and lint pin what the admin-field split and the code login loosened"
description = "S2, CAP-2 to CAP-6 (579/3, 580/5; F-B, F-E, V-4, C-4, C-8, V-3, V-5, D-4): a Worker test sends a real admin D1 session with DEV_USER_EMAIL unset and gets 403 on /api/agent/sync and the visits route, in src/worker/auth.test.ts rather than sync.test.ts, which entries 4 and 6 edit (CAP-2); a lint rule or test fails on role !== \"admin\" in agent.ts or a client field file and on the word passphrase in src, and the \"pass\" + \"phrase\" string leaves users.test.ts (CAP-3); a client test shows an admin identity keeps every outbox row across a 403 and an App visit, in the App tests rather than src/client/field/sync.test.ts, which entries 3 and 6 edit (CAP-4); the Utilisateurs row menu is asserted as an exact item set in place of the /Passer (admin|agent)/ assertions, optionally with a start_url manifest test and an App-level Hors ligne body assertion (CAP-5); and the sign-in tests pin a rejected passphrase kind, an admin code spent just before and at 1 h, two real admins with live codes, a role flip between mint and spend, break-glass on the agent form leaving no users or sessions row (the form-level check only; entry 1 owns the Worker-level refusal test), and the admin form's state on swap (CAP-6)."
verify = "Five hand mutations each turn pnpm lint or pnpm test red: role !== \"admin\" added to src/worker/routes/agent.ts, the word passphrase added to a file in src, any outbox row deleted on an admin 403, a role toggle re-added to the Utilisateurs row menu under a new label, and the TTL CASE branches swapped in src/worker/routes/identity.ts."
covers = ["CAP-2", "CAP-3", "CAP-4", "CAP-5", "CAP-6"]
after = [1]
hitl = false
risk = "medium"
labels = ["area:worker", "area:field", "area:admin", "area:ci"]
unknown = "Whether the Done-when greps are best kept by an ESLint rule (no-restricted-syntax or a custom rule in eslint.config.js) or by a test that scans src; and how CAP-6's rejected passphrase kind test coexists with CAP-3's ban on the word: assumed one named allowlist entry for that test, in place of the \"pass\" + \"phrase\" trick at src/worker/users.test.ts:429, unless the owner prefers otherwise."

