# The stories of epic-refusal-reasons, in build order.

[[entry]]
id = 1
type = "story"
title = "Refusal reasons in the contract and the database"
description = "Adds REFUSAL_REASONS to src/shared/constants.ts, an optional refusalReason in visitSchema (zod/mini), and a nullable visits.refusal_reason column plus prospects.out_of_target_reviewed_at through pnpm db:generate (expand only). The sync stores the reason only for not_interested and null otherwise, and never refuses a visit over it. It also adds REFUSAL_REASON_LABELS in src/client/copy/shared.ts, re-exported by copy/field.ts like the outcome labels, a 7-row value/label table under 'Refusal reason' in docs/glossary.md, the list and the rule in docs/domains/prospecting.md, and updates docs/api.md and docs/data-model.md. Entries 2, 3 and 4 build on these constants, labels and columns."
verify = "Worker tests show a not_interested visit stores its reason, while a visit with no reason and one with a reason on another outcome are both accepted with null. not_interested derives rejected and the other outcomes keep their OUTCOME_TO_STATUS status. The migration applies with pnpm db:migrate:local, and the PR quotes the precache total against 1,000 KiB because copy/shared.ts reaches the field bundle."
covers = ["CAP-2", "CAP-3", "CAP-6"]
after = []
hitl = false
risk = "low"
references = ["_bmad-output/specs/spec-not-interested-skips-script/refusal-reasons.md", "docs/api.md, Conventions"]
unknown = "None known."

[[entry]]
id = 2
type = "story"
title = "Pas intéressé asks for a reason, not the script"
description = "Relies on entry 1's REFUSAL_REASONS and the labels imported through copy/field. On Pas intéressé, step 2 shows the 7 native radios in place of the script's questions, whether or not a script is cached, and the notes stay. visit-draft.ts refuses no reason, and 'Autre' with empty notes, then sends refusalReason with answers {}. docs/domains/field-operations.md and the visit form section of docs/design.md are updated."
verify = "DOM tests show the radios in refusal-reasons.md order with and without a script. Save is blocked with no reason and with 'Autre' and empty notes, each with its copy/field message. A saved visit carries refusalReason and answers {} even with answers left from another result, and other outcomes behave as before. The PR quotes the precache total against 1,000 KiB."
covers = ["CAP-1", "CAP-2"]
after = [1, "4.14"]
hitl = false
risk = "medium"
references = ["_bmad-output/specs/spec-done-stop-leaves-the-round/when-step.md", "src/client/field/visit-draft.ts", "src/client/field/VisitScreen.tsx"]
unknown = "None known."

[[entry]]
id = 3
type = "story"
title = "Visites shows and filters refusal reasons"
description = "Relies on entry 1's column and labels. Admin visit rows carry refusalReason. VisitsLedger.tsx shows its label beside OUTCOME_LABELS for Pas intéressé, and nothing for older visits. A 'Raison du refus' filter (the 7 reasons) is added that combines with from, to and since. GET /api/admin/visits and export.csv take the same reason= param, and export.csv gains a refusal_reason column. docs/api.md and the Visites section of docs/design.md are updated."
verify = "Worker tests show reason= filters the list and the export identically, combined with from, to and since, and an unknown reason, including none, is a 400. The CSV has refusal_reason, empty when null. DOM tests show the label, nothing on an old visit, the filter narrowing the ledger, and the live poll and export link carrying reason=."
covers = ["CAP-4", "CAP-5"]
after = [1, "3.4"]
hitl = false
risk = "low"
references = ["src/client/admin/visits/VisitsLedger.tsx", "src/worker/routes/admin.ts"]
unknown = "None known."

[[entry]]
id = 4
type = "story"
title = "Prospects flags places reported Hors cible"
description = "Relies on entry 1's refusal_reason and out_of_target_reviewed_at, and follows entry 3 in admin.ts. It adds a 'Hors cible signalé' Prospects filter with a count, listing prospects whose latest visit carries out_of_target and whose out_of_target_reviewed_at is not after that visit. A direct admin PATCH of the prospect's fields or status stamps it; assign, merge and CSV import do not. A newer visit with another outcome also clears the flag. docs/api.md and docs/domains/prospecting.md are updated."
verify = "Worker tests show the flag appears after an out_of_target visit, clears on a later PATCH and on a newer visit with another outcome, and survives assign, merge and batch import. A DOM test shows the filter and its count in Prospects."
covers = ["CAP-7"]
after = [3, "3.5"]
hitl = false
risk = "medium"
references = ["src/worker/routes/admin.ts, lines 709, 758, 978 and 1158 (updated_at writers)"]
unknown = "None known."

