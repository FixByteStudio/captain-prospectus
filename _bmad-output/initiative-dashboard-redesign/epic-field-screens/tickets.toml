# epic-field-screens — build order. Status never lives here.

[[entry]]
id = 1
type = "story"
title = "Tournée du jour"
description = "Tracer bullet: rebuilds Tournée du jour with the next-stop card (Y aller, Visiter), stop rows that expand on tap to the same two buttons, Plus tard, the 'Pas encore envoyé' badge, the empty and position-denied states and the two-pane tablet layout, with StopRow and StopNumber as shared components Carte and the admin round view reuse; rewrites docs/design.md's Tournée section."
verify = "In airplane mode at 390 and 820 px, in light and dark, the screen matches key-f1-tournee.html, tapping a row reveals Visiter and Y aller, and the PR quotes the precache total and the entry chunk."
covers = ["CAP-6", "CAP-11"]
after = ["2.1", "1.1", "1.7"]
hitl = false
risk = "medium"
references = ["_bmad-output/planning-artifacts/ux-designs/ux-captain-prospectus-2026-09-24/mockups/key-f1-tournee.html"]
