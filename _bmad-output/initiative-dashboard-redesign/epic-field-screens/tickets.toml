[[entry]]
id = 2
type = "story"
title = "Daily progress"
description = "Adds G8's Dexie version 3 log of today's sent visit ids, written when a visit is queued and pruned to today, counts n as that log plus the pending outbox rows deduplicated by visit id, and shows 'n visites sur N aujourd'hui' with its bar; exposes the queueing function the save sheet calls."
verify = "Tests show two visits queued and one accepted still count 2, the next day resets the count, the outbox clears only on accepted, and a version 2 database holding outbox rows upgrades with every row intact."
covers = ["CAP-6"]
after = [1]
hitl = false
risk = "high"
references = ["_bmad-output/specs/spec-dashboard-redesign/server-gaps.md"]
unknown = "Which clock prunes the log: the device's local midnight is assumed."

[[entry]]
id = 3
type = "story"
title = "Swipe actions on stop rows"
description = "Adds a pointer handler with no library to StopRow: swiping left opens Visiter and swiping right opens Y aller, the panel reveal is instant under prefers-reduced-motion, and vertical scrolling is never taken over."
verify = "A DOM test drives each direction and asserts the action started, and on a real phone a vertical scroll over the list never triggers a swipe."
covers = ["CAP-6"]
after = [1]
hitl = false
risk = "medium"
unknown = "How to tell a horizontal swipe from a vertical scroll on iOS Safari without a library; touch-action pan-y is assumed."

