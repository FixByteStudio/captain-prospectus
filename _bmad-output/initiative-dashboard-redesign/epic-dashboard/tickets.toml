type = "story"
title = "Pipeline par statut and Activité par agent"
description = "Adds the pipeline (count and share of live prospects per status) and the per-agent activity (visits and conversions in the period, follow_up and open prospects assigned now) to the endpoint, and renders the pipeline bars and the agent table."
