[[entry]]
id = 3
type = "story"
title = "Tableau de bord at /admin"
description = "Tracer bullet: adds GET /api/admin/dashboard?period=7|30|90 with its zod contract in src/shared and docs/api.md, on Europe/Brussels calendar days, computing Visites and Prospects ouverts with their deltas; makes Tableau de bord the /admin index with the header, the period selector (default 30), those two KPI cards, skeletons and the load-failed alert; shows copy.errors.notFound on unknown /admin paths (#90); invalidates the dashboard query on every admin mutation; and adds docs/design.md's dashboard section."
verify = "A worker test asserts Visites and Prospects ouverts for 7, 30 and 90 days against its own rows, including '—' when the previous period is 0; in pnpm dev /admin shows both cards changing with the period and /admin/inconnu shows the not-found message."
covers = ["CAP-2", "CAP-11"]
after = [1, "1.4"]
hitl = false
risk = "medium"
references = ["https://github.com/FixbyteStudio/captain-prospectus/issues/90", "_bmad-output/planning-artifacts/ux-designs/ux-captain-prospectus-2026-09-24/mockups/key-a1-dashboard.html"]
unknown = "The Brussels day boundary is an assumption (epic Notes); every later entry reuses the one this entry defines."

[[entry]]
id = 4
type = "story"
title = "Seed 180 days of dashboard data"
description = "Extends /api/dev/seed and scripts/seed.mjs with visits over the last 180 days for both agents and every outcome, flyers, follow-ups due today and within 7 days, one manual status change, one merged prospect, orphaned visits and a duplicate pair, so every dashboard panel shows data in pnpm dev."
verify = "After pnpm db:seed:local on a fresh local D1, every KPI, the pipeline, the per-agent rows and the three À traiter counts are non-zero for 7, 30 and 90 days, and a second run adds no rows."
covers = ["CAP-2"]
after = [3]
hitl = false
risk = "low"
unknown = "Orphaned visits only arise through the sync path, so the seed may have to post them to /api/agent/sync rather than insert them."

[[entry]]
id = 5
type = "story"
title = "Convertis and Taux de conversion"
description = "Adds the Convertis and Taux de conversion KPIs to the endpoint and their cards, counting a prospect as converted in the period from a visit with outcome converted or a manual change to Converti (status_set_at), over the distinct prospects visited in the period."
verify = "Worker tests cover a prospect converted by a visit, one converted manually, one converted twice in the period (counted once), a merged prospect and a previous period of 0, for 7, 30 and 90 days."
covers = ["CAP-2"]
after = [4]
hitl = false
risk = "medium"
unknown = "Whether a prospect converted and then reopened inside the period still counts; 'became Converti' suggests it does."

[[entry]]
